# Zen Adaptive Memory Manager (ZAMM) preferences.
# Strict mode (10-minute idle unloading) is the default.
# The legacy `zen.tab-unloader.timeout-minutes` pref is still honored as a
# one-time fallback when `zen.memory.idle-timeout-minutes` was never set.

- name: zen.memory.enabled
  value: true

- name: zen.memory.mode
  value: "strict"

- name: zen.memory.idle-timeout-minutes
  value: 10

- name: zen.memory.early-unload-enabled
  value: true

- name: zen.memory.include-pinned
  value: true

- name: zen.memory.include-essentials
  value: true

- name: zen.memory.exempt-hosts
  value: ""

- name: zen.memory.ram-budget-mb
  value: 0

- name: zen.memory.reopen-cooldown-seconds
  value: 120

- name: zen.memory.max-discards-per-sweep
  value: 5

- name: zen.memory.sweep-interval-seconds
  value: 60

- name: zen.memory.experimental-sleep
  value: false

# Idle RTCPeerConnection-only tabs (no camera/microphone/screen capture) may be
# unloaded after the idle deadline in Strict mode. Gecko cannot distinguish an
# idle connection from a remote-only or muted call from the browser process, so
# this is an explicit opt-in and never applies to Balanced or Performance.
- name: zen.memory.unload-idle-peer-connections
  value: true
